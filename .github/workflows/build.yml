name: Build

# Cross-platform wheels for the PyO3 extension, plus an sdist. Pushing a `v*`
# tag additionally attaches every artifact to the GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --release

  linux:
    name: linux ${{ matrix.target }}
    # aarch64 runs natively; cross-compiling it under QEMU takes an order of
    # magnitude longer for identical output.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          # `--features vendor-openssl` makes `openssl-src` configure and build
          # OpenSSL from source, which needs the full Perl distribution; the
          # manylinux images only carry a subset. Same recipe as `typst-py`,
          # which vendors OpenSSL the same way.
          before-script-linux: |
            if which yum >/dev/null 2>&1; then
              yum install -y perl-core perl-IPC-Cmd || yum install -y perl-core || true
            elif which apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y perl libtext-template-perl || true
            fi
          args: --release --out dist --features vendor-openssl
      - name: Smoke test the wheel
        if: matrix.target == 'x86_64'
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python - <<'PY'
          import mpl_typst_core

          measurer = mpl_typst_core.TypstCoreMeasurer(include_system_fonts=False)
          print("measure:", measurer.measure_text("Hello"))

          source = "#set page(width: 100pt, height: 100pt)\nHello Tagged World!"
          measurer.compile_pdf(source, "default.pdf")
          measurer.compile_pdf(source, "tagged.pdf", tagged=True)
          default = open("default.pdf", "rb").read()
          tagged = open("tagged.pdf", "rb").read()

          # Typst tags PDFs by default; the structure tree is dead weight for a
          # figure, so the core opts out and keeps it behind the flag.
          assert b"/StructElem" not in default, "PDF tagging must be opt-in"
          assert b"/StructElem" in tagged
          assert len(default) < len(tagged), (len(default), len(tagged))
          print(f"pdf: default={len(default)}B tagged={len(tagged)}B")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    name: windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: macos ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  release:
    name: attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # No checkout in this job, so name the repository explicitly.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --generate-notes --title "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
