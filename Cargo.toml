[package]
name = "mpl-typst-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Native Rust core extension for Matplotlib Typst backend"
readme = "README.md"
repository = "https://github.com/111inhistory/mpl_typst_core"

[lib]
name = "mpl_typst_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Links OpenSSL statically for `typst-kit/system-downloader`. Required on
# manylinux, where no system OpenSSL development headers are available.
vendor-openssl = ["typst-kit/vendor-openssl"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
parking_lot = "0.12"
mitex = "0.2.4"
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts", "system-files", "system-packages", "system-downloader"] }
typst-library = "0.15.1"
typst-eval = "0.15.1"
typst-syntax = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-svg = "0.15.1"
ecow = "0.2"
comemo = "0.5"

[profile.release]
# The wheel is loaded into a Python process; favour size and speed.
lto = "thin"
codegen-units = 1
